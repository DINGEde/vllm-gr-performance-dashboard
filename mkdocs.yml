site_name: AgentCache Dashboard
site_description: Benchmark dashboard generated from compact dashboard-summary.json artifacts.

docs_dir: docs
site_dir: site

theme:
  name: mkdocs
  custom_dir: overrides

nav:
  - AgentCache Dashboard: index.md
  - vllm-gr Performance: vllm-gr.md
  - vllm-gr Data Format: vllm-gr-data-format.md

exclude_docs: |
  README.md

extra_css:
  - stylesheets/dashboard.css
  - stylesheets/vllm-gr-dashboard.css
  - stylesheets/vllm-gr-overview.css

extra_javascript:
  - javascripts/dashboard.js
  - javascripts/vllm-gr-dashboard.js?v=20260829-2

markdown_extensions:
  - tables
  - toc:
      permalink: true
