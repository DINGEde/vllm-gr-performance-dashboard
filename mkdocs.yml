site_name: AgentCache Dashboard
site_description: Benchmark dashboard generated from compact dashboard-summary.json artifacts.

docs_dir: docs
site_dir: site

theme:
  name: mkdocs
  custom_dir: overrides

nav:
  - AgentCache Dashboard: index.md
  - vllm-gr Performance: vllm-gr.md
  - NPU vllm-gr Performance: npu-vllm-gr.md
  - NPU vllm-gr Performance (v2): npu-vllm-gr-v2.md
  - vllm-gr Data Format: vllm-gr-data-format.md

exclude_docs: |
  README.md

extra_css:
  - stylesheets/dashboard.css?v=20260928-1
  - stylesheets/vllm-gr-dashboard.css?v=20260928-1
  - stylesheets/npu-dashboard.css?v=20261020-3
  - stylesheets/npu-v2-dashboard.css?v=20261119-2
  - stylesheets/page-outline.css?v=20261020-1

extra_javascript:
  - javascripts/dashboard.js
  - javascripts/vllm-gr-dashboard.js?v=20261120-1
  - javascripts/npu-dashboard.js?v=20261119-1
  - javascripts/npu-v2-dashboard.js?v=20261126-1
  - javascripts/page-outline.js?v=20261020-1

markdown_extensions:
  - tables
  - toc:
      permalink: true
