name: Benchmark Dashboard

on:
  push:
    branches: [main]
    paths:
      - "runs/**"
      - "schemas/**"
      - "scripts/**"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/benchmark-dashboard.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dashboard dependencies
        run: python -m pip install --disable-pip-version-check mkdocs==1.6.1

      - name: Build dashboard data
        run: |
          python scripts/build_benchmark_dashboard.py --source runs --output docs
          python scripts/build_vllm_gr_dashboard.py --source runs --output docs

      - name: Build static site
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
