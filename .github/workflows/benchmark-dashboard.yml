name: Benchmark Dashboard

on:
  push:
    branches: [benchmark-artifacts]
    paths:
      - "runs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build dashboard data
        run: python scripts/build_benchmark_dashboard.py --source runs --output docs

      - name: Commit dashboard refresh
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Update benchmark dashboard"
          git push
