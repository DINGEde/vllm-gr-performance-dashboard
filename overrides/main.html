{% extends "base.html" %}

{# Brand mark + top title only. #}
{% block site_name %}
{%- set top = (nav|list)|first %}
<div class="site-menu">
  <span class="site-menu-icon" aria-hidden="true"><i class="fa-solid fa-chart-line"></i></span>
  <a class="navbar-brand" href="{{ nav.homepage.url|url }}">{% if top %}{{ top.title }}{% else %}{{ config.site_name }}{% endif %}</a>
</div>
{% endblock %}

{% block site_nav %}{% endblock %}
